name: Build Solomon OS Gaming Edition ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Check out Solomon OS
        uses: actions/checkout@v4

      - name: Build with Debian 13
        run: |
          docker run --rm --privileged \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -e -c '
              apt-get update
              apt-get install -y live-build debootstrap debian-archive-keyring squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin
              bash iso/build-iso.sh
            '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: SolomonOS-GamingEdition-v0.2
          path: |
            output/SolomonOS-GamingEdition-v0.2-amd64.iso
            output/SolomonOS-GamingEdition-v0.2-amd64.iso.sha256
          compression-level: 0
          if-no-files-found: error
